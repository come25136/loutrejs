name: Setup Bun workspace
description: Bunをsetupし、Bunでrepository dependencyをinstallする
inputs:
  bun-version:
    description: setupするBun version
    required: true
runs:
  using: composite
  steps:
    - name: Setup Bun ${{ inputs.bun-version }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Verify Bun version
      shell: bash
      run: test "$(bun --version)" = "${{ inputs.bun-version }}"

    - name: Prepare private SWC native cache
      shell: bash
      run: |
        SWC_CACHE_DIR="$(mktemp -d /tmp/loutre-swc-native.XXXXXX)"
        printf 'SWC_NATIVE_BINDING_CACHE=%s\n' "$SWC_CACHE_DIR" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: bun install --no-save

    - name: Verify native compiler binding
      shell: bash
      run: |
        bun --eval 'try { await import("@swc/core") } catch (error) { console.error(error); console.error(error.cause); process.exit(1) }'
