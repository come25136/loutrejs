name: Setup Deno workspace
description: Denoをsetupし、Denoでrepository dependencyをinstallする
inputs:
  deno-version:
    description: setupするDeno version
    required: true
runs:
  using: composite
  steps:
    - name: Setup Deno ${{ inputs.deno-version }}
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ inputs.deno-version }}

    - name: Verify Deno version
      shell: bash
      run: test "$(deno eval 'console.log(Deno.version.deno)')" = "${{ inputs.deno-version }}"

    - name: Install dependencies
      shell: bash
      # Deno 2.9.5 は有効な package-lock.json の変換に失敗するため、npm lockfile は読み込ませない。
      # Security Dependabot PR は脆弱性修正を優先し、公開後7日の待機を解除する。
      # runtime / initializer検証ではwebsiteをbuildせず、その依存の再解決を避ける。
      run: |
        deno eval 'const path = "package.json"; const manifest = JSON.parse(Deno.readTextFileSync(path)); manifest.workspaces = manifest.workspaces.filter((workspace) => workspace !== "website"); Deno.writeTextFileSync(path, JSON.stringify(manifest, null, 2) + "\n")'
        if test "${SECURITY_DEPENDABOT_PR:-false}" = 'true'; then
          deno install --no-lock --minimum-dependency-age 0
        else
          deno install --no-lock
        fi
