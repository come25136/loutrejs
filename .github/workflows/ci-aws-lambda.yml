name: AWS Lambda conformance

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  conformance:
    name: AWS Lambda Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build packages
        run: npm run build

      - name: Run AWS Lambda conformance
        run: npm run test:aws-lambda
