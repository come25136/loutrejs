name: Cloudflare Workers conformance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 24.x

      - name: Build packages
        run: npm run build

      - name: Run Cloudflare Workers conformance
        run: npm run test:cloudflare-workers
