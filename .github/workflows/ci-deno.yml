name: Deno runtime conformance

on:
  workflow_call:
    inputs:
      deno-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  conformance:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup workspace
        uses: ./.github/actions/setup-deno-workspace
        with:
          deno-version: ${{ inputs.deno-version }}

      - name: Build packages with Deno
        run: |
          DENO_BIN="$(command -v deno)"
          "$DENO_BIN" run -A scripts/clean-dist.mjs
          "$DENO_BIN" run -A npm:typescript@7.0.2/tsc -p tsconfig.packages.json --pretty false
          "$DENO_BIN" run -A scripts/prepare-packages.mjs

      - name: Run Deno CLI conformance
        run: |
          DENO_BIN="$(command -v deno)"
          "$DENO_BIN" run -A packages/cli/bin/loutre.js check --entry fixtures/http-crud/src/app.ts
          "$DENO_BIN" run -A packages/cli/bin/loutre.js build fixtures/http-crud/src/app.ts --out-dir dist/cli-conformance/deno
          "$DENO_BIN" run -A packages/cli/bin/loutre.js openapi --entry fixtures/http-crud/src/app.ts > dist/cli-conformance/deno/openapi.json

      - name: Build Deno conformance applications
        run: |
          DENO_BIN="$(command -v deno)"
          "$DENO_BIN" run -A packages/cli/bin/loutre.js build fixtures/http-crud/src/app.ts --out-dir dist/conformance/http-crud
          "$DENO_BIN" run -A packages/cli/bin/loutre.js build fixtures/streaming/src/http-app.ts --out-dir dist/conformance/streaming-http
          "$DENO_BIN" run -A packages/cli/bin/loutre.js build fixtures/streaming/src/message-port-app.ts --out-dir dist/conformance/streaming-message-port

      - name: Run Deno conformance
        run: |
          DENO_BIN="$(command -v deno)"
          "$DENO_BIN" run -A --sloppy-imports conformance/deno.ts
