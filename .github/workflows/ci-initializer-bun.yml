name: create-loutre Bun native

on:
  workflow_call:
    inputs:
      bun-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Native Initializer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun ${{ inputs.bun-version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Download initializer build
        uses: actions/download-artifact@v5
        with:
          name: create-loutre-build
          path: packages

      - name: Install dependencies
        run: bun install --no-save

      - name: Create Bun project
        shell: bash
        run: |
          rm -rf .tmp/create-loutre-native
          mkdir -p .tmp/create-loutre-native
          cd .tmp/create-loutre-native
          output="$(bun create loutre bun-app --yes --no-install --target bun)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "Package manager: Bun"
          grep -q "bunRuntime" bun-app/src/main.ts
