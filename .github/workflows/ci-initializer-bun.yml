name: create-loutre Bun native

on:
  workflow_call:
    inputs:
      bun-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Download initializer build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: create-loutre-build
          path: packages

      - name: Create Bun project
        shell: bash
        run: |
          rm -rf .tmp/create-loutre-native
          mkdir -p .tmp/create-loutre-native
          cd .tmp/create-loutre-native
          output="$(bun create loutre bun-app --yes --no-install --target bun)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "Package manager: Bun"
          grep -q "bunRuntime" bun-app/src/main.ts
