name: create-loutre Deno native

on:
  workflow_call:
    inputs:
      deno-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Deno ${{ inputs.deno-version }} LTS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup workspace
        uses: ./.github/actions/setup-deno-workspace
        with:
          deno-version: ${{ inputs.deno-version }}

      - name: Download initializer build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: create-loutre-build
          path: packages

      - name: Create Deno project
        shell: bash
        run: |
          rm -rf .tmp/create-loutre-native
          mkdir -p .tmp/create-loutre-native
          output="$(deno run -A packages/create-loutre/bin/create-loutre.js .tmp/create-loutre-native/deno-app --yes --no-install --target deno)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "Package manager: Deno"
          grep -q "denoRuntime" .tmp/create-loutre-native/deno-app/src/main.ts
