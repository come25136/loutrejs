name: Node.js minimum compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  minimum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x

      - name: Install Node.js 22 type baseline
        run: npm install --no-save --package-lock=false @types/node@22.20.1

      - name: Type check
        run: npm run check

      - name: Public type tests
        run: npm run test:types

      - name: Build packages
        run: npm run build
