name: Node.js quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Node.js 24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 24.x

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Public type tests
        run: npm run test:types

      - name: Build packages
        run: npm run build

      - name: Verify published packages
        run: node scripts/verify-packages.mjs

      - name: Pack published packages
        run: node scripts/pack-packages.mjs

      - name: Upload package tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loutre-package-tarballs
          path: dist/package-tarballs/*.tgz
          if-no-files-found: error

      - name: Upload initializer build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: create-loutre-build
          path: |
            packages/loutre/dist
            packages/create-loutre/dist
          if-no-files-found: error
