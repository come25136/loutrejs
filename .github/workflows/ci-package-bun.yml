name: Bun package consumer

on:
  workflow_call:
    inputs:
      bun-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  consumer:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun ${{ inputs.bun-version }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Verify Bun version
        run: test "$(bun --version)" = "${{ inputs.bun-version }}"

      - name: Download package tarballs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: loutre-package-tarballs
          path: ${{ runner.temp }}/loutre-package-tarballs

      - name: Verify packed packages
        shell: bash
        run: |
          set -euo pipefail
          tarballs="${RUNNER_TEMP}/loutre-package-tarballs"
          consumer="${RUNNER_TEMP}/loutre-package-consumer-bun"
          rm -rf "$consumer"
          mkdir -p "$consumer"
          cd "$consumer"

          loutre="$(realpath "$tarballs"/loutrejs-loutre-*.tgz)"
          cli="$(realpath "$tarballs"/loutrejs-cli-*.tgz)"
          create="$(realpath "$tarballs"/create-loutre-*.tgz)"
          cat > package.json <<JSON
          {
            "name": "loutre-package-consumer-bun",
            "private": true,
            "type": "module",
            "dependencies": {
              "@loutrejs/loutre": "file:$loutre",
              "@loutrejs/cli": "file:$cli",
              "create-loutre": "file:$create"
            },
            "overrides": {
              "@loutrejs/loutre": "file:$loutre"
            }
          }
          JSON

          bun install
          bun --eval "import { bunRuntime } from '@loutrejs/loutre/runtime/bun'; if (bunRuntime.runtime !== 'bun') throw new Error('Bun runtime import failed')"
          bun node_modules/@loutrejs/cli/bin/loutre.js --help | grep -q '^Loutre CLI$'
          bun node_modules/create-loutre/bin/create-loutre.js bun-app --yes --no-install --target bun
          grep -q 'bunRuntime' bun-app/src/main.ts
