name: Deno package consumer

on:
  workflow_call:
    inputs:
      deno-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  consumer:
    name: Deno ${{ inputs.deno-version }} LTS
    runs-on: ubuntu-latest
    steps:
      - name: Setup Deno ${{ inputs.deno-version }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ inputs.deno-version }}

      - name: Verify Deno version
        run: test "$(deno eval 'console.log(Deno.version.deno)')" = "${{ inputs.deno-version }}"

      - name: Download package tarballs
        uses: actions/download-artifact@v5
        with:
          name: loutre-package-tarballs
          path: ${{ runner.temp }}/loutre-package-tarballs

      - name: Verify packed packages
        shell: bash
        run: |
          set -euo pipefail
          tarballs="${RUNNER_TEMP}/loutre-package-tarballs"
          extracted="${RUNNER_TEMP}/loutre-package-extracted-deno"
          consumer="${RUNNER_TEMP}/loutre-package-consumer-deno"
          rm -rf "$extracted" "$consumer"
          mkdir -p "$extracted" "$consumer"

          extract_package() {
            local archive="$1"
            local destination="$2"
            mkdir -p "$extracted/$destination"
            tar -xzf "$archive" -C "$extracted/$destination" --strip-components=1
          }
          extract_package "$tarballs"/loutrejs-loutre-*.tgz loutre
          extract_package "$tarballs"/loutrejs-cli-*.tgz cli
          extract_package "$tarballs"/create-loutre-*.tgz create-loutre

          version="$(deno eval "const manifest = JSON.parse(Deno.readTextFileSync('$extracted/loutre/package.json')); console.log(manifest.version)")"
          cd "$consumer"
          cat > package.json <<JSON
          {
            "name": "loutre-package-consumer-deno",
            "private": true,
            "type": "module",
            "dependencies": {
              "@loutrejs/loutre": "$version",
              "@loutrejs/cli": "$version",
              "create-loutre": "$version"
            }
          }
          JSON
          cat > deno.json <<JSON
          {
            "nodeModulesDir": "manual",
            "links": [
              "$extracted/loutre",
              "$extracted/cli",
              "$extracted/create-loutre"
            ]
          }
          JSON

          deno install
          deno eval "import { denoRuntime } from '@loutrejs/loutre/runtime/deno'; if (denoRuntime.runtime !== 'deno') throw new Error('Deno runtime import failed')"
          deno run -A node_modules/@loutrejs/cli/bin/loutre.js --help | grep -q '^Loutre CLI$'
          deno run -A node_modules/create-loutre/bin/create-loutre.js deno-app --yes --no-install --target deno
          grep -q 'denoRuntime' deno-app/src/main.ts
