name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Node.js 26 Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Public type tests
        run: npm run test:types

      - name: Build packages
        run: npm run build

      - name: Verify published packages
        run: node scripts/verify-packages.mjs

  tests:
    name: Node.js 26 Unit & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit & E2E tests
        run: npm test

      - name: Run Node.js conformance
        run: npm run test:node

  runtime-conformance:
    name: Runtime Conformance (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Deno
            command: npm run test:deno
            deno: true
          - name: Bun
            command: npm run test:bun
          - name: workerd
            command: npm run test:workerd
          - name: Electron
            command: LOUTRE_ELECTRON_NO_SANDBOX=1 xvfb-run --auto-servernum npm run test:electron
          - name: Lambda
            command: npm run test:lambda
          - name: CLI
            command: npm run test:cli-start && npm run test:cli-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm

      - name: Setup Deno baseline
        if: ${{ matrix.deno == true }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npm run build

      - name: Run ${{ matrix.name }} conformance
        run: ${{ matrix.command }}
