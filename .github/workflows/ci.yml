name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Node.js 24
    uses: ./.github/workflows/ci-node-quality.yml

  minimum-node-types:
    name: Node.js 22
    uses: ./.github/workflows/ci-node-minimum.yml

  node-tests:
    name: Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x, 26.x]
    uses: ./.github/workflows/ci-node-tests.yml
    with:
      node-version: ${{ matrix.node }}

  bun-conformance:
    name: Bun ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [1.3.14, 1.4.0]
    uses: ./.github/workflows/ci-bun.yml
    with:
      bun-version: ${{ matrix.version }}

  deno-conformance:
    name: Deno 2.9 LTS
    uses: ./.github/workflows/ci-deno.yml
    with:
      deno-version: 2.9.5

  cloudflare-workers-conformance:
    name: Cloudflare Workers
    uses: ./.github/workflows/ci-cloudflare-workers.yml

  electron-conformance:
    name: Electron ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [42.10.1, 43.4.1, 44.0.0]
    uses: ./.github/workflows/ci-electron.yml
    with:
      electron-version: ${{ matrix.version }}

  aws-lambda-conformance:
    name: AWS Lambda Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    uses: ./.github/workflows/ci-aws-lambda.yml
    with:
      node-version: ${{ matrix.node }}

  bun-initializer:
    name: create-loutre Bun ${{ matrix.version }}
    needs: quality-checks
    strategy:
      fail-fast: false
      matrix:
        version: [1.3.14, 1.4.0]
    uses: ./.github/workflows/ci-initializer-bun.yml
    with:
      bun-version: ${{ matrix.version }}

  deno-initializer:
    name: create-loutre Deno 2.9 LTS
    needs: quality-checks
    uses: ./.github/workflows/ci-initializer-deno.yml
    with:
      deno-version: 2.9.5
