name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Checks
    uses: ./.github/workflows/ci-node-quality.yml

  minimum-node-types:
    name: Minimum API Compatibility
    uses: ./.github/workflows/ci-node-minimum.yml

  node-tests:
    name: Unit & E2E Tests
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x, 26.x]
    uses: ./.github/workflows/ci-node-tests.yml
    with:
      node-version: ${{ matrix.node }}

  bun-conformance:
    name: Runtime Conformance
    strategy:
      fail-fast: false
      matrix:
        version: [1.3.14, 1.4.0]
    uses: ./.github/workflows/ci-bun.yml
    with:
      bun-version: ${{ matrix.version }}

  deno-conformance:
    name: Runtime Conformance
    uses: ./.github/workflows/ci-deno.yml
    with:
      deno-version: 2.9.5

  cloudflare-workers-conformance:
    name: Runtime Conformance
    uses: ./.github/workflows/ci-cloudflare-workers.yml

  electron-conformance:
    name: Runtime Conformance
    strategy:
      fail-fast: false
      matrix:
        version: [42.10.1, 43.4.1, 44.0.0]
    uses: ./.github/workflows/ci-electron.yml
    with:
      electron-version: ${{ matrix.version }}

  aws-lambda-conformance:
    name: Runtime Conformance
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    uses: ./.github/workflows/ci-aws-lambda.yml
    with:
      node-version: ${{ matrix.node }}

  node-package-consumer:
    name: Package Consumer
    needs: quality-checks
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    uses: ./.github/workflows/ci-package-node.yml
    with:
      node-version: ${{ matrix.node }}

  bun-package-consumer:
    name: Package Consumer
    needs: quality-checks
    strategy:
      fail-fast: false
      matrix:
        version: [1.3.14, 1.4.0]
    uses: ./.github/workflows/ci-package-bun.yml
    with:
      bun-version: ${{ matrix.version }}

  deno-package-consumer:
    name: Package Consumer
    needs: quality-checks
    uses: ./.github/workflows/ci-package-deno.yml
    with:
      deno-version: 2.9.5

  bun-initializer:
    name: Native Initializer
    needs: quality-checks
    strategy:
      fail-fast: false
      matrix:
        version: [1.3.14, 1.4.0]
    uses: ./.github/workflows/ci-initializer-bun.yml
    with:
      bun-version: ${{ matrix.version }}

  deno-initializer:
    name: Native Initializer
    needs: quality-checks
    uses: ./.github/workflows/ci-initializer-deno.yml
    with:
      deno-version: 2.9.5

  required:
    name: CI
    if: ${{ always() }}
    needs:
      - quality-checks
      - minimum-node-types
      - node-tests
      - bun-conformance
      - deno-conformance
      - cloudflare-workers-conformance
      - electron-conformance
      - aws-lambda-conformance
      - node-package-consumer
      - bun-package-consumer
      - deno-package-consumer
      - bun-initializer
      - deno-initializer
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every CI job passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
