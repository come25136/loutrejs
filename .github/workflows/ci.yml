name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Node.js 24 Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Public type tests
        run: npm run test:types

      - name: Build packages
        run: npm run build

      - name: Verify published packages
        run: node scripts/verify-packages.mjs

      - name: Upload initializer build
        uses: actions/upload-artifact@v4
        with:
          name: create-loutre-build
          path: |
            packages/loutre/dist
            packages/create-loutre/dist
          if-no-files-found: error

  minimum-node-types:
    name: Node.js 22 Minimum API Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Node.js 22 type baseline
        run: npm install --no-save --package-lock=false @types/node@22.20.1

      - name: Type check
        run: npm run check

      - name: Public type tests
        run: npm run test:types

      - name: Build packages
        run: npm run build

  tests:
    name: Node.js ${{ matrix.node }} Unit & E2E Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x, 26.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit & E2E tests
        run: npm test

      - name: Run Node.js CLI conformance
        run: |
          node packages/cli/bin/loutre.js check --entry fixtures/http-crud/src/app.ts
          node packages/cli/bin/loutre.js build fixtures/http-crud/src/app.ts --out-dir dist/cli-conformance/node
          node packages/cli/bin/loutre.js openapi --entry fixtures/http-crud/src/app.ts > dist/cli-conformance/node/openapi.json

      - name: Run Node.js conformance
        run: npm run test:node

  runtime-conformance:
    name: Runtime Conformance (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Deno 2.9 LTS
            node: 24.x
            deno: true
            deno_version: 2.9.5
            cli_runner: deno run -A
            command: npm run test:deno
          - name: Bun 1.3
            node: 24.x
            bun: true
            bun_version: 1.3.14
            cli_runner: bun
            command: npm run build:conformance-apps && bun --version && bun run conformance/bun.ts
          - name: Bun 1.4
            node: 24.x
            bun: true
            bun_version: 1.4.0
            cli_runner: bun
            command: npm run build:conformance-apps && bun --version && bun run conformance/bun.ts
          - name: Cloudflare Workers (workerd lockfile)
            node: 24.x
            command: npm run test:cloudflare-workers
          - name: Electron 42
            node: 24.x
            electron: true
            electron_version: 42.10.1
            command: LOUTRE_ELECTRON_NO_SANDBOX=1 xvfb-run --auto-servernum npm run test:electron
          - name: Electron 43
            node: 24.x
            electron: true
            electron_version: 43.4.1
            command: LOUTRE_ELECTRON_NO_SANDBOX=1 xvfb-run --auto-servernum npm run test:electron
          - name: Electron 44
            node: 24.x
            electron: true
            electron_version: 44.0.0
            command: LOUTRE_ELECTRON_NO_SANDBOX=1 xvfb-run --auto-servernum npm run test:electron
          - name: AWS Lambda Node.js 22
            node: 22.x
            command: npm run test:aws-lambda
          - name: AWS Lambda Node.js 24
            node: 24.x
            command: npm run test:aws-lambda
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup Deno baseline
        if: ${{ matrix.deno == true }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno_version }}

      - name: Setup Bun baseline
        if: ${{ matrix.bun == true }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun_version }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Electron baseline
        if: ${{ matrix.electron == true }}
        run: npm install --no-save --package-lock=false electron@${{ matrix.electron_version }}

      - name: Build packages
        run: npm run build

      - name: Run native CLI conformance
        if: ${{ matrix.cli_runner != null }}
        run: |
          ${{ matrix.cli_runner }} packages/cli/bin/loutre.js check --entry fixtures/http-crud/src/app.ts
          ${{ matrix.cli_runner }} packages/cli/bin/loutre.js build fixtures/http-crud/src/app.ts --out-dir dist/cli-conformance/runtime
          ${{ matrix.cli_runner }} packages/cli/bin/loutre.js openapi --entry fixtures/http-crud/src/app.ts > dist/cli-conformance/runtime/openapi.json

      - name: Run ${{ matrix.name }} conformance
        run: ${{ matrix.command }}

  initializer-native:
    name: create-loutre native (${{ matrix.name }})
    needs: quality-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bun 1.3
            bun: true
            version: 1.3.14
          - name: Bun 1.4
            bun: true
            version: 1.4.0
          - name: Deno 2.9 LTS
            deno: true
            version: 2.9.5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun ${{ matrix.version }}
        if: ${{ matrix.bun == true }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.version }}

      - name: Setup Deno ${{ matrix.version }}
        if: ${{ matrix.deno == true }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.version }}

      - name: Download initializer build
        uses: actions/download-artifact@v5
        with:
          name: create-loutre-build
          path: packages

      - name: Install dependencies with Bun
        if: ${{ matrix.bun == true }}
        run: bun install --no-save

      - name: Install dependencies with Deno
        if: ${{ matrix.deno == true }}
        run: deno install

      - name: Create project with Bun
        if: ${{ matrix.bun == true }}
        shell: bash
        run: |
          rm -rf .tmp/create-loutre-native
          mkdir -p .tmp/create-loutre-native
          cd .tmp/create-loutre-native
          output="$(bun create loutre bun-app --yes --no-install --target bun)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "Package manager: Bun"
          grep -q "bunRuntime" bun-app/src/main.ts

      - name: Create project with Deno
        if: ${{ matrix.deno == true }}
        shell: bash
        run: |
          rm -rf .tmp/create-loutre-native
          mkdir -p .tmp/create-loutre-native
          output="$(deno run -A packages/create-loutre/bin/create-loutre.js .tmp/create-loutre-native/deno-app --yes --no-install --target deno)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "Package manager: Deno"
          grep -q "denoRuntime" .tmp/create-loutre-native/deno-app/src/main.ts
