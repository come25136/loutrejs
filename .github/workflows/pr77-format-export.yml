name: PR77 Format Export

on:
  pull_request:
    paths:
      - docs/adr/loutre_application_graph_kernel_architecture.md
      - docs/adr/loutre_execution_extension_contract_architecture.md
      - .github/workflows/pr77-format-export.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 24.x

      - name: Format ADRs
        run: npx oxfmt docs/adr/loutre_application_graph_kernel_architecture.md docs/adr/loutre_execution_extension_contract_architecture.md

      - name: Upload formatted ADRs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr77-formatted-adrs
          path: |
            docs/adr/loutre_application_graph_kernel_architecture.md
            docs/adr/loutre_execution_extension_contract_architecture.md
          if-no-files-found: error
