name: SWC Carrier Diagnostic

on:
  push:
    branches: [diagnostics/swc-carrier]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.3.14', '1.4.0']
        swc: ['1.16.13', '1.16.17']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - name: キャッシュ権限とruntimeごとの失敗を比較
        env:
          DIAGNOSTIC_SWC_VERSION: ${{ matrix.swc }}
        run: node diagnostics/swc-carrier.mjs
