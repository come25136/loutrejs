name: SWC Carrier Diagnostic

on:
  push:
    branches: [diagnostics/swc-carrier]

permissions:
  contents: read

jobs:
  original-workspace:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.3.14', '1.4.0']
    env:
      NPM_CONFIG_MIN_RELEASE_AGE: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 診断scriptをcheckout外へ保存
        run: cp diagnostics/swc-workspace.mjs "$RUNNER_TEMP/swc-workspace.mjs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7a17b37392eee84fec8fa1feead9417ffb812e1b
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - name: install前のcacheを確認
        run: node "$RUNNER_TEMP/swc-workspace.mjs" --inspect
      - name: 元のCIと同じ依存一式をinstall
        run: |
          strace -f -e trace=mkdir,mkdirat,chmod,fchmod,umask,execve -o "$RUNNER_TEMP/swc-install.trace" bun install --no-save
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'swc-install.trace').read_text().splitlines()
          cache_lines = [line for line in lines if '/home/runner/.cache' in line or 'umask(' in line]
          creators = {line.split()[0] for line in cache_lines}
          for line in lines:
              if line in cache_lines or (line.split()[0] in creators and 'execve(' in line):
                  print('INSTALL_TRACE', line)
          PY
      - name: import失敗の詳細と専用cacheの効果を比較
        run: node "$RUNNER_TEMP/swc-workspace.mjs"
  reproduce:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.3.14', '1.4.0']
        swc: ['1.16.13', '1.16.17']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - name: キャッシュ権限とruntimeごとの失敗を比較
        env:
          DIAGNOSTIC_SWC_VERSION: ${{ matrix.swc }}
        run: node diagnostics/swc-carrier.mjs
