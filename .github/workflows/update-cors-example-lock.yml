name: Update CORS example lockfile

on:
  push:
    branches: [feat/cors-layer]

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/cors-layer

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit package lock
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update lockfile for CORS example'
          git push origin HEAD:feat/cors-layer
