services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: loutre
      POSTGRES_PASSWORD: loutre
      POSTGRES_DB: loutre
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loutre -d loutre']
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - '54321:5432'
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
